[project]
name = "savanty"
version = "0.3.0"
description = "AI agent that turns vague planning problems into optimal solutions"
authors = [{ name = "Dipankar Sarkar", email = "me@dipankar.name" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
keywords = ["planning", "scheduling", "optimization", "ai-agent", "llm", "asp", "constraint-satisfaction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.31.1",
    "openai>=1.0.0",
    "clorm>=1.6.0",
    "click>=8.0.0",
    "dspy-ai>=3.0.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]
desktop = [
    "slint>=1.9.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "pymdown-extensions>=10.0.0",
]

[project.scripts]
savanty = "savanty.cli:main"
savanty-desktop = "desktop.main:main"

[project.gui-scripts]
savanty-app = "desktop.main:main"

[project.urls]
Repository = "https://github.com/skelf-research/savanty"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["savanty", "desktop"]

[tool.hatch.build.targets.sdist]
include = [
    "savanty/",
    "desktop/",
    "README.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    "dist",
    "build",
    "frontend/node_modules",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["savanty"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=savanty --cov-report=term-missing"

[tool.coverage.run]
source = ["savanty"]
omit = ["*/tests/*", "*/__init__.py"]
